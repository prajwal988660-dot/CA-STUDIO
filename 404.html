<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | CA STUDIO</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#2563EB">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tailwind-config.js"></script>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="font-sans antialiased selection:bg-brand-blue selection:text-white">

    <div class="fixed inset-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-blue-300/40 rounded-full mix-blend-multiply filter blur-[120px] animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-cyan-300/40 rounded-full mix-blend-multiply filter blur-[120px] animate-blob blob-delay-2"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[60vw] h-[60vw] bg-indigo-200/50 rounded-full mix-blend-multiply filter blur-[120px] animate-blob blob-delay-4"></div>
    </div>

    <main class="min-h-screen flex items-center justify-center px-6">
        <div class="max-w-xl w-full glass-panel rounded-[2.5rem] p-10 md:p-16 text-center">
            <div class="text-7xl md:text-8xl font-black text-gradient mb-4">404</div>
            <h1 class="text-3xl md:text-4xl font-black text-brand-text mb-4">Page Not Found</h1>
            <p class="text-xl text-brand-muted font-medium mb-10">The page you're looking for doesn't exist or has moved.</p>
            <a href="index.html" class="inline-block px-10 py-5 bg-brand-text text-white text-lg font-black rounded-2xl shadow-xl hover:-translate-y-1 hover:bg-gray-800 transition-all duration-300">Back to Home</a>
        </div>
    </main>

    <script src="assets/main.js"></script>
</body>
</html>
