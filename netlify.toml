# Netlify configuration — Vite + React SPA for CA STUDIO.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page-app fallback: serve index.html for any client-side route so
# deep links like /about or /contact work on refresh. (Netlify handles form
# POSTs and real files before applying this rule.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sensible security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
